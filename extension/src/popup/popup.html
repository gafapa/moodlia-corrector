<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoodlIA Corrector · Sitios</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <h1>MoodlIA Corrector</h1>
      <p id="status" role="status" aria-live="polite">Comprobando la página actual...</p>
      <nav aria-label="Sitios de Moodle">
        <button id="add-site" type="button">Añadir sitio</button>
        <button id="manage-sites" class="secondary" type="button">Gestionar sitios</button>
      </nav>
      <section id="add-view" aria-labelledby="add-title" hidden>
        <h2 id="add-title">Añadir un Moodle</h2>
        <form id="add-site-form">
          <label for="site-url">Dirección del Moodle</label>
          <input id="site-url" type="url" required placeholder="https://campus.ejemplo.es/moodle" autocomplete="url" aria-describedby="site-hint" />
          <p id="site-hint">El corrector se activará automáticamente en las páginas de corrección de este Moodle.</p>
          <button id="save-site" type="submit">Añadir</button>
        </form>
      </section>
      <section id="manage-view" aria-labelledby="manage-title" hidden>
        <h2 id="manage-title" tabindex="-1">Sitios guardados</h2>
        <ul id="sites-list"></ul>
        <p id="empty-sites" hidden>No hay sitios guardados. Usa Añadir sitio para guardar un Moodle.</p>
      </section>
    </main>
    <script src="../i18nMessages.js"></script>
    <script src="../i18n.js"></script>
    <script src="../activation.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
